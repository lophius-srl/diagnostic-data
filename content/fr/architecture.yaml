# Schémas d'architecture générés à partir des réponses.
# Les textes peuvent utiliser les variables de recommendations.yaml (ex. {tableau}).
# Les schémas ne montrent QUE les outils cochés par la PME.

legend:
  auto: Automatique
  manual: À la main

today:
  title: Aujourd'hui
  subtitle: Vos outils, et la façon dont vos chiffres circulent.
  unknownTools: Vos outils (à identifier)
  # Légende au-dessus des outils quand ils ne se parlent pas.
  silo:
    when:
      any:
        - { q: recopie, in: [parfois, souvent] }
        - { q: memes_chiffres, is: chacun }
        - { q: ventes_en_ligne, is: main }
    text: Des outils qui ne se parlent pas
  # Mentions sous un outil, selon les réponses (première règle vraie par outil).
  toolNotes:
    - {
        tools: [shopify, woocommerce, lightspeed],
        when: { q: ventes_en_ligne, is: main },
        text: ventes exportées à la main,
      }
    - {
        tools: [shopify, woocommerce, lightspeed],
        when: { q: ventes_en_ligne, is: auto },
        text: relié à la comptabilité,
      }
    - { tools: [fiduciaire], when: { q: fiduciaire, is: direct }, text: reçoit vos pièces directement }
    - { tools: [fiduciaire], when: { q: fiduciaire, is: email }, text: reçoit vos pièces par e-mail }
    - { tools: [fiduciaire], when: { q: fiduciaire, is: papier }, text: reçoit vos pièces en papier }
    - { tools: [fiduciaire], text: partenaire externe }
  externalAutoWhen: { q: fiduciaire, is: direct }
  excel:
    label: Fichiers Excel
    detail: là où vos chiffres sont réunis
    notes:
      - { when: { fact: dependance_personne }, text: tenus par une seule personne }
      - { when: { fact: versions_multiples }, text: plusieurs versions des chiffres }
      - { when: { fact: reporting_manuel }, text: des heures de copier-coller }
  people:
    label: Vous et la direction
    # Sans Excel : lecture outil par outil, sauf si les chiffres sont disponibles en quelques minutes.
    autoWhen: { q: ventes_mois, is: minutes }
    detailManual: chiffres réunis à la main
    detailAuto: chiffres consultés dans chaque outil

target:
  title: Cible recommandée
  subtitle: Vos outils actuels, reliés une fois pour toutes.
  unknownTools: Vos outils actuels
  excelSource:
    label: Fichiers Excel
    detail: importés, plus recopiés
  integration:
    label: Synchronisation automatique
    detail: chaque nuit, sans intervention
  base:
    label: Base centrale
    detail: une seule version des chiffres
  outputs:
    - { label: 'Tableau de bord {tableau}', detail: sur ordinateur et téléphone }
    - { label: Rapports automatiques, detail: dans votre boîte mail }
    - { label: Votre fiduciaire, detail: reçoit tout au bon format, requiresTools: [fiduciaire] }
    - { label: Alertes, detail: quand un chiffre sort de l'ordinaire, when: { q: taille, in: [t20_49, t50p] } }
  people:
    label: Vous et l'équipe
    detail: chacun voit ses chiffres
