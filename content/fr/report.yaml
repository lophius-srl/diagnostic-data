glossary:
  - term: Base centrale (entrepôt de données, data warehouse)
    definition: Une base qui réunit les chiffres de tous vos logiciels, avec leur historique. C'est la « source unique de vérité » de l'entreprise.
  - term: Synchronisation automatique (ETL)
    definition: 'Le programme qui va chercher les données dans vos logiciels, les met au propre et les range dans la base centrale, par exemple chaque nuit.'
  - term: Tableau de bord (outil de BI)
    definition: "L'écran qui affiche vos chiffres clés à jour (business intelligence). Dans votre cas, nous recommandons {tableau}."
  - term: API
    definition: 'La « prise » par laquelle un logiciel accepte de partager ses données avec un autre, sans copier-coller.'
  - term: Indicateur clé (KPI)
    definition: "Un chiffre suivi régulièrement parce qu'il aide à décider : marge, trésorerie, délai de paiement, panier moyen…"

disclaimer: "Ce diagnostic est indicatif : il repose sur vos réponses et sur des règles d'expertise, sans accès à vos données. Il ne remplace pas un audit sur pièces."
