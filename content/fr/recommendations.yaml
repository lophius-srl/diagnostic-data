# Recommandations : variables de texte, quick wins et feuille de route 30 / 60 / 90 jours.
#
# Textes à trous :
#   - {clé} d'un `requiresTools` → les outils cochés parmi la liste (« WinBooks », « Odoo et Teamleader »…).
#     Si aucun n'est coché, l'action n'est PAS proposée : jamais de recommandation sur un outil absent.
#   - {id} d'une variable ci-dessous → première règle vraie.
# Tri des quick wins : impact × écart de l'axe (100 − score) + bonus si `boostIf` + petit bonus si effort faible.
# Style : titre = l'action, détail = le bénéfice, en une phrase.

variables:
  - id: tableau
    rules:
      - { when: { q: microsoft, is: oui }, value: Power BI }
      - { value: Looker Studio }
  - id: stockage
    rules:
      - { when: { q: microsoft, is: oui }, value: OneDrive ou SharePoint }
      - { when: { q: microsoft, is: google }, value: Google Drive }
      - { value: un stockage en ligne européen }

quickWins:
  - id: qw_relier_ventes_compta
    title: Relier {ventes} à {compta}
    detail: Le chiffre d'affaires passe seul d'un outil à l'autre. Fin de la double saisie.
    when: { q: recopie, in: [parfois, souvent] }
    requiresTools:
      ventes: [odoo, teamleader, metier, lightspeed]
      compta: [exact, winbooks, bob, yuki, billit, sage]
    dimension: centralisation
    effort: moyen
    impact: eleve
    boostIf: { q: priorite, is: doubles }

  - id: qw_boutique_compta
    title: Envoyer automatiquement les ventes {boutique} vers {compta}
    detail: Commandes, remboursements et frais arrivent seuls en comptabilité, chaque jour.
    when: { q: recopie, in: [parfois, souvent] }
    requiresTools:
      boutique: [shopify, woocommerce, lightspeed]
      compta: [exact, winbooks, bob, yuki, billit, sage, odoo]
    dimension: automatisation
    effort: faible
    impact: eleve
    boostIf: { q: priorite, is: doubles }

  - id: qw_boutique_fiduciaire
    title: Transmettre les ventes {boutique} à votre fiduciaire, sans export
    detail: Un envoi complet chaque mois, au bon format. Moins d'allers-retours.
    excludeIf: { q: outils, hasAny: [exact, winbooks, bob, yuki, billit, sage, odoo] }
    requiresTools:
      boutique: [shopify, woocommerce, lightspeed]
      fiduciaire: [fiduciaire]
    dimension: automatisation
    effort: faible
    impact: moyen

  - id: qw_pieces_fiduciaire
    title: Déposer vos factures directement chez votre fiduciaire
    detail: Une adresse de dépôt suffit. Vous gagnez du temps chaque mois, elle aussi.
    when: { q: temps_tableaux, in: [journee, jours, semaine] }
    requiresTools:
      fiduciaire: [fiduciaire]
    dimension: automatisation
    effort: faible
    impact: moyen

  - id: qw_tableau_bord
    title: Vos 5 chiffres clés dans {tableau}, à jour chaque matin
    detail: Alimentés depuis {logiciels}. Vous regardez au lieu de calculer.
    when:
      any:
        - { q: ventes_mois, in: [heures, jours] }
        - { q: frequence, in: [mois, bilan, rarement] }
    requiresTools:
      logiciels: [odoo, teamleader, exact, winbooks, bob, yuki, billit, sage, shopify, woocommerce, lightspeed, metier]
    dimension: pilotage
    effort: moyen
    impact: eleve
    boostIf: { q: priorite, is: vue }

  - id: qw_odoo_tableaux
    title: Exploiter les tableaux de bord déjà inclus dans Odoo
    detail: Bien configurés, ils évitent d'acheter un autre outil.
    when:
      any:
        - { q: ventes_mois, in: [heures, jours] }
        - { q: frequence, in: [bilan, rarement] }
    requiresTools:
      odoo: [odoo]
    dimension: pilotage
    effort: faible
    impact: moyen

  - id: qw_marge
    title: Calculer votre marge réelle par client et par produit
    detail: Les données sont déjà dans {logiciels}. Il suffit de les croiser.
    when: { q: priorite, is: marge }
    requiresTools:
      logiciels: [odoo, teamleader, exact, winbooks, bob, yuki, billit, sage, shopify, woocommerce, lightspeed, metier]
    dimension: pilotage
    effort: moyen
    impact: eleve
    boostIf: { q: priorite, is: marge }

  - id: qw_une_version
    title: Une seule version des chiffres pour toute l'équipe
    detail: Des règles de calcul écrites une fois, une seule source. Les réunions portent sur les décisions.
    when: { q: justesse, in: [pas_toujours, discussion] }
    dimension: fiabilite
    effort: faible
    impact: eleve

  - id: qw_controles
    title: Des contrôles automatiques sur vos chiffres
    detail: Une facture manque, un total ne colle pas ? Vous le savez avant la réunion.
    when: { q: justesse, in: [pas_toujours, discussion] }
    dimension: fiabilite
    effort: moyen
    impact: moyen

  - id: qw_documenter_excel
    title: Documenter et sécuriser votre fichier Excel clé
    detail: Une demi-journée suffit pour que l'entreprise ne dépende plus d'une seule tête.
    when: { q: personne_excel, in: [complique, perdus] }
    requiresTools:
      excel: [excel]
    dimension: autonomie
    effort: faible
    impact: eleve
    boostIf: { q: priorite, is: dependance }

  - id: qw_automatiser_rapport
    title: Relier votre rapport Excel le plus long à {logiciels}
    detail: Il se remplit seul. Le copier-coller disparaît, les erreurs aussi.
    when: { q: temps_tableaux, in: [journee, jours, semaine] }
    requiresTools:
      excel: [excel]
      logiciels: [odoo, teamleader, exact, winbooks, bob, yuki, billit, sage, shopify, woocommerce, lightspeed, metier]
    dimension: automatisation
    effort: moyen
    impact: eleve
    boostIf: { q: priorite, is: doubles }

  - id: qw_sauvegarde
    title: Une sauvegarde automatique de tous vos fichiers
    detail: Sur {stockage}, avec l'historique. Un vol ne coûte plus que le matériel.
    when: { q: ordinateur, in: [quelques_uns, oui] }
    dimension: securite
    effort: faible
    impact: eleve

  - id: qw_autonomie
    title: Donner à chacun l'accès à ses chiffres
    detail: Chaque responsable consulte ses chiffres dans {tableau}, sans attendre qu'on les prépare.
    when:
      any:
        - { q: autonomie, in: [demander, introuvable] }
        - { q: personne_excel, is: perdus }
    dimension: autonomie
    effort: moyen
    impact: moyen
    boostIf: { q: priorite, is: dependance }

  # ---- Actions de secours, toujours possibles, choisies seulement s'il manque des quick wins ----
  - id: qw_decisions
    title: Lister vos 5 décisions du mois et les chiffres qu'il vous faut
    detail: Deux heures pour partir de vos décisions, pas de vos fichiers.
    dimension: pilotage
    effort: faible
    impact: moyen
    fallback: true

  - id: qw_inventaire
    title: Faire l'inventaire de vos fichiers et de qui les tient
    detail: Une page suffit. On ne peut améliorer que ce que l'on voit.
    dimension: sources
    effort: faible
    impact: moyen
    fallback: true

  - id: qw_rituel
    title: Un rendez-vous de 15 minutes par semaine avec vos chiffres
    detail: Toujours le même jour, toujours les mêmes chiffres.
    dimension: pilotage
    effort: faible
    impact: moyen
    fallback: true

roadmap:
  - id: j30
    label: 30 jours
    title: Premiers résultats
    max: 4
    actions:
      - id: rm_chiffres_cles
        title: Écrire vos chiffres clés et leur mode de calcul
        detail: Une page de référence validée par la direction.
        unlessQuickWin: qw_une_version

  - id: j60
    label: 60 jours
    title: Réunir vos chiffres
    max: 3
    actions:
      - id: rm_base_centrale_excel
        title: Réunir {logiciels} et vos fichiers Excel dans une base centrale
        detail: Mise à jour chaque nuit. Excel reste utilisable, mais n'est plus la source.
        requiresTools:
          logiciels:
            [odoo, teamleader, exact, winbooks, bob, yuki, billit, sage, shopify, woocommerce, lightspeed, metier]
          excel: [excel]
      - id: rm_base_centrale
        title: Réunir {logiciels} dans une base centrale
        detail: Mise à jour chaque nuit, une seule version des chiffres.
        when: { q: outils, countAtLeast: 2, exclude: [excel, fiduciaire, nesaispas] }
        excludeIf: { q: outils, has: excel }
        requiresTools:
          logiciels:
            [odoo, teamleader, exact, winbooks, bob, yuki, billit, sage, shopify, woocommerce, lightspeed, metier]
      - id: rm_tableau_bord
        title: Un tableau de bord {tableau} alimenté automatiquement
        detail: Sur ordinateur comme sur téléphone.
        unlessQuickWin: qw_tableau_bord
      - id: rm_controles_qualite
        title: Des contrôles automatiques sur vos chiffres clés
        detail: Chaque nuit, une vérification repère ce qui ne colle pas.
        unlessQuickWin: qw_controles
      - id: rm_historique
        title: Garder l'historique de vos chiffres, mois après mois
        detail: Pour comparer chaque mois à l'année précédente.

  - id: j90
    label: 90 jours
    title: Automatiser et rendre autonome
    max: 3
    # Les étapes conditionnelles d'abord : elles répondent à un point précis du diagnostic.
    actions:
      - id: rm_securite
        title: Formaliser sauvegardes, accès et documentation
        detail: Pour que tout continue si une personne clé s'absente.
        when:
          any:
            - { fact: sauvegarde_partielle }
            - { fact: dependance_personne }
      - id: rm_fiduciaire_auto
        title: Automatiser les échanges avec votre fiduciaire
        detail: Pièces, ventes et clôtures partent seules, au bon format.
        requiresTools:
          fiduciaire: [fiduciaire]
      - id: rm_rapports_auto
        title: Automatiser les rapports récurrents
        detail: Ils se préparent seuls et arrivent dans votre boîte mail.
      - id: rm_alertes
        title: Être alerté quand un chiffre sort de l'ordinaire
        detail: Trésorerie, marge, retards de paiement.
      - id: rm_former
        title: Former l'équipe à lire ses chiffres seule
        detail: Deux courtes sessions suffisent.
