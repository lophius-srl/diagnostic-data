# 5 niveaux, du plus simple au plus avancé. `min` = score global minimum (0 à 100).
- id: artisanal
  label: Artisanal
  min: 0
  summary: Vos chiffres existent, mais les réunir prend du temps.
- id: structure
  label: Structuré
  min: 20
  summary: Les bons outils sont là, mais ils ne se parlent pas encore.
- id: pilote
  label: Piloté
  min: 40
  summary: Vous suivez vos chiffres. Les préparer coûte encore trop de temps.
- id: automatise
  label: Automatisé
  min: 60
  summary: L'essentiel se met à jour seul. Reste à le partager.
  # Plafond : impossible d'être « automatisé » tant que des chiffres sont recopiés ou exportés à la main.
  blockedBy:
    any:
      - { fact: double_saisie }
      - { fact: reporting_manuel }
      - { fact: versions_multiples }
  blockedReason: Des chiffres passent encore à la main, ou ne font pas encore foi.
- id: data_driven
  label: Data-driven
  min: 80
  summary: Vos chiffres guident vos décisions. Bravo.
  blockedBy:
    any:
      - { fact: double_saisie }
      - { fact: reporting_manuel }
      - { fact: versions_multiples }
      - { fact: dependance_personne }
      - { fact: pilotage_annuel }
  blockedReason: 'Un point fragile vous retient : chiffres discutés, dépendance à une personne ou suivi trop espacé.'
