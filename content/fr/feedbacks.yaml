# Retours d'expert affichés juste après une réponse : une phrase, percutante, jamais culpabilisante, sans statistique.
# Au plus un retour toutes les `feedbackMinGap` questions (settings.yaml), le plus prioritaire.

- id: outils_nombreux
  after: outils
  when: { q: outils, countAtLeast: 4, exclude: [fiduciaire, nesaispas] }
  text: '{outils} : vous êtes bien équipé. Reste à savoir si ces outils se parlent.'
  priority: 1

- id: recopie_souvent
  after: recopie
  when: { q: recopie, is: souvent }
  text: "Classique : votre PME a grandi plus vite que ses outils. C'est aussi ce qui se corrige le plus vite."
  priority: 3

- id: ventes_rapides
  after: ventes_mois
  when: { q: ventes_mois, is: minutes }
  text: "Très bon signe : c'est la base de tout pilotage."
  priority: 1

- id: ventes_lentes
  after: ventes_mois
  when: { q: ventes_mois, is: jours }
  text: Ce délai peut presque toujours tomber à quelques minutes.
  priority: 2

- id: chiffres_discutes
  after: justesse
  when: { q: justesse, is: discussion }
  text: Quand on débat des chiffres, c'est souvent qu'il en existe plusieurs versions.
  priority: 3

- id: temps_eleve
  after: temps_tableaux
  when: { q: temps_tableaux, in: [jours, semaine] }
  text: Ce temps a un prix. Nous le chiffrons dans vos résultats.
  priority: 2

- id: personne_cle
  after: personne_excel
  when: { q: personne_excel, is: perdus }
  text: Très courant, et c'est un vrai risque. Ce savoir se documente en quelques jours.
  priority: 3

- id: sauvegarde_absente
  after: ordinateur
  when: { q: ordinateur, is: oui }
  text: Le point le plus simple à régler du diagnostic, en une demi-journée.
  priority: 3

- id: tresorerie_inconnue
  after: tresorerie
  when: { q: tresorerie, is: non }
  text: "C'est la prévision la plus utile à une PME. Elle s'automatise très bien."
  priority: 3

- id: marge_variable
  after: definitions
  when: { q: definitions, is: chacun }
  text: Une règle de calcul écrite une fois met fin à la plupart des débats.
  priority: 2

- id: acces_flous
  after: acces
  when: { q: acces, is: inconnu }
  text: Point fréquent, et simple à clarifier en une matinée.
  priority: 2
