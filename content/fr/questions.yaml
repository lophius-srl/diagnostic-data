# Questions du diagnostic, dans l'ordre du parcours : 10 au total, 9 ou 10 vues par PME.
#
# Règles de rédaction (vérifiées par tests/content.rules.test.ts) :
#   - 15 mots maximum par question, langage de tous les jours ;
#   - 4 réponses maximum (sauf le sélecteur d'outils, type « tools ») ;
#   - aucun mot de la liste interdite (KPI, indicateur, connecteur, ERP, RGPD, maturité…).
#
# `scores` : points de 0 à 3 par dimension. `facts` : faits utilisés par les recommandations.
# `showIf` : condition d'affichage, uniquement sur des questions posées AVANT.

- id: outils
  text: Où sont vos chiffres ? Cochez tout ce que vous utilisez.
  type: tools
  options:
    - { id: excel, tool: excel, label: Excel / Google Sheets, scores: { sources: 1 } }
    - { id: odoo, tool: odoo, label: Odoo, scores: { sources: 3 } }
    - { id: teamleader, tool: teamleader, label: Teamleader, scores: { sources: 2 } }
    - { id: exact, tool: exact, label: Exact Online, scores: { sources: 3 } }
    - { id: winbooks, tool: winbooks, label: WinBooks, scores: { sources: 2 } }
    - { id: bob, tool: bob, label: BOB, scores: { sources: 2 } }
    - { id: yuki, tool: yuki, label: Yuki, scores: { sources: 3 } }
    - { id: billit, tool: billit, label: Billit, scores: { sources: 2 } }
    - { id: sage, tool: sage, label: Sage, scores: { sources: 2 } }
    - { id: shopify, tool: shopify, label: Shopify, scores: { sources: 3 } }
    - { id: woocommerce, tool: woocommerce, label: WooCommerce, scores: { sources: 2 } }
    - { id: lightspeed, tool: lightspeed, label: Lightspeed, scores: { sources: 3 } }
    - { id: metier, tool: metier, label: Logiciel métier, scores: { sources: 2 } }
    - { id: fiduciaire, tool: fiduciaire, label: Chez notre fiduciaire, scores: { sources: 1 } }
    - { id: nesaispas, label: Je ne sais pas, exclusive: true, scores: { sources: 0 } }

- id: recopie
  text: Vous recopiez des infos d'un logiciel à l'autre ?
  type: single
  showIf: { q: outils, countAtLeast: 2, exclude: [fiduciaire, nesaispas] }
  options:
    - { id: non, label: Non, scores: { centralisation: 3, automatisation: 3, fiabilite: 3 } }
    - { id: parfois, label: Parfois, scores: { centralisation: 1, automatisation: 1, fiabilite: 2 } }
    - id: souvent
      label: 'Oui, souvent'
      scores: { centralisation: 0, automatisation: 0, fiabilite: 1 }
      facts: [double_saisie]

- id: ventes_mois
  text: Pour connaître vos ventes du mois dernier, il vous faut…
  type: single
  options:
    - { id: minutes, label: Quelques minutes, scores: { pilotage: 3, centralisation: 3, autonomie: 3 } }
    - { id: heures, label: Quelques heures, scores: { pilotage: 1, centralisation: 1, autonomie: 1 } }
    - id: jours
      label: Plusieurs jours
      scores: { pilotage: 0, centralisation: 0, autonomie: 0 }
      facts: [chiffres_lents]

- id: frequence
  text: Vous regardez vos chiffres…
  type: single
  options:
    - { id: semaine, label: Chaque semaine, scores: { pilotage: 3 } }
    - { id: mois, label: Chaque mois, scores: { pilotage: 2 } }
    - { id: bilan, label: Surtout au bilan, scores: { pilotage: 1 }, facts: [pilotage_annuel] }
    - { id: rarement, label: Rarement, scores: { pilotage: 0 }, facts: [pilotage_annuel] }

- id: justesse
  text: Vos chiffres sont-ils toujours justes ?
  type: single
  options:
    - { id: confiance, label: 'Oui, on a confiance', scores: { fiabilite: 3 } }
    - { id: pas_toujours, label: Pas toujours, scores: { fiabilite: 1 } }
    - { id: discussion, label: 'Souvent, on en discute', scores: { fiabilite: 0 }, facts: [versions_multiples] }

# Sert au coût caché (settings.yaml → hiddenCost) : une échelle simple, sans calcul à faire.
- id: temps_tableaux
  text: Chaque mois, préparer vos tableaux et rapports vous prend…
  type: single
  options:
    - { id: heures, label: Quelques heures, scores: { automatisation: 3 } }
    - { id: journee, label: Une journée, scores: { automatisation: 2 } }
    - { id: jours, label: Plusieurs jours, scores: { automatisation: 1 }, facts: [reporting_manuel] }
    - { id: semaine, label: Une semaine ou plus, scores: { automatisation: 0 }, facts: [reporting_manuel] }

- id: personne_excel
  text: Si votre « personne Excel » est absente un mois…
  type: single
  showIf: { q: outils, has: excel }
  options:
    - { id: pas_de_souci, label: Pas de souci, scores: { autonomie: 3, securite: 3 } }
    - { id: complique, label: Ce serait compliqué, scores: { autonomie: 1, securite: 1 }, facts: [dependance_personne] }
    - { id: perdus, label: On serait perdus, scores: { autonomie: 0, securite: 0 }, facts: [dependance_personne] }

- id: autonomie
  text: 'Une question sur vos chiffres : vous trouvez la réponse seul ?'
  type: single
  showIf: { not: { q: outils, has: excel } }
  options:
    - { id: clics, label: 'Oui, en quelques clics', scores: { autonomie: 3 } }
    - { id: demander, label: Il faut demander, scores: { autonomie: 1 }, facts: [dependance_personne] }
    - { id: introuvable, label: 'Souvent, on ne trouve pas', scores: { autonomie: 0 } }

- id: ordinateur
  text: 'Un ordinateur volé demain : vous perdez des fichiers importants ?'
  type: single
  options:
    - { id: sauvegarde, label: 'Non, tout est sauvegardé', scores: { securite: 3 } }
    - { id: quelques_uns, label: Peut-être quelques-uns, scores: { securite: 1 }, facts: [sauvegarde_partielle] }
    - { id: oui, label: 'Oui, sûrement', scores: { securite: 0 }, facts: [sauvegarde_partielle] }

# Préférences (orientent les recommandations, sans score)
- id: microsoft
  text: Vous travaillez avec Microsoft 365 (Outlook, Teams) ?
  type: single
  options:
    - { id: oui, label: Oui }
    - { id: google, label: 'Non, plutôt Google' }
    - { id: eviter, label: 'Non, et on préfère éviter Microsoft' }

- id: priorite
  text: Si vous pouviez régler une seule chose demain ?
  type: single
  options:
    - { id: vue, label: Voir mes chiffres d'un coup d'œil }
    - { id: doubles, label: Arrêter les doubles encodages }
    - { id: marge, label: Savoir où je gagne de l'argent }
    - { id: dependance, label: Ne plus dépendre d'une seule personne }
