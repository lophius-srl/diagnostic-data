glossary:
  - term: Central database (data warehouse)
    definition: A database that brings together the numbers from all your software, with their history. It is the business's "single source of truth".
  - term: Automatic sync (ETL)
    definition: 'The program that fetches data from your software, cleans it up and stores it in the central database, for instance every night.'
  - term: Dashboard (BI tool)
    definition: 'The screen showing your key numbers, up to date (business intelligence). In your case, we recommend {tableau}.'
  - term: API
    definition: 'The "plug" through which one software agrees to share its data with another, without copy-paste.'
  - term: Key indicator (KPI)
    definition: 'A number tracked regularly because it helps decide: margin, cash, payment delays, average basket…'

disclaimer: 'This check-up is indicative: it relies on your answers and on expert rules, without access to your data. It does not replace a full audit.'
footer: 'Lophius SRL · www.lophius.be'
