# Packages shown at the end of the check-up, as the logical next step. Same rules as content/fr/offers.yaml.
# PLACEHOLDERS: durations and prices to be filled in by Antoine (excl. VAT).

maxRecommended: 2

offers:
  - id: audit_express
    title: Express data audit
    duration: '[[duration, e.g. 3 days]]'
    price: '€[[price]] excl. VAT'
    summary: A precise review of your tools, files and data flows, with a costed action plan.
    deliverables:
      - Map of your tools and how your numbers flow
      - Detailed analysis of the 7 areas
      - Prioritised action plan, costed in days and euros
    why: Before investing, an outside view to know exactly where to start.
    recommendBelowScore: 40
    recommendIf:
      any:
        - { q: outils, has: nesaispas }
        - { fact: versions_multiples }
    priority: 1

  - id: tableau_bord
    title: Management dashboard in 10 days
    duration: 10 days
    price: '€[[price]] excl. VAT'
    summary: Your key numbers in a {tableau} dashboard, fed by your real tools and delivered in 10 working days.
    deliverables:
      - Workshop to define your key numbers
      - '{tableau} dashboard on desktop and mobile'
      - Automatic refresh and team training
    why: You want to see where the business stands at a glance, without recalculating anything.
    recommendIf:
      any:
        - { q: priorite, in: [vue, marge] }
        - { q: frequence, in: [bilan, rarement] }
        - { q: ventes_mois, in: [heures, jours] }
    preferredIf: { q: priorite, in: [vue, marge] }
    priority: 2

  - id: centralisation
    title: Data centralisation & automated reporting
    duration: '[[duration]]'
    price: 'From €[[X]] excl. VAT'
    summary: Your tools connected to a central database, reports that build themselves, and no more copy-paste.
    deliverables:
      - Central database fed automatically from your tools
      - Automated recurring reports
      - Documentation and handover to the team
    why: Numbers still move by hand from one tool to another. This is the project that frees up the most time.
    recommendIf:
      any:
        - { fact: double_saisie }
        - { fact: reporting_manuel }
        - { q: priorite, is: doubles }
    preferredIf: { q: priorite, in: [doubles, dependance] }
    priority: 3

cheques:
  title: Walloon business vouchers
  text: Part of this service may, under conditions, be funded by the Walloon Region's business vouchers (chèques-entreprises). To be checked against the vouchers available when you apply.
